<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · AplicaFacil</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main>
  <h1>Iniciar sesión</h1>
  <p class="subtitle">AplicaFacil</p>

  <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></div>
  <div class="alert ok" th:if="${param.registered}" role="status">Cuenta creada. Ya puedes iniciar sesión.</div>
  <div class="alert ok" th:if="${param.logout}" role="status">Sesión cerrada.</div>

  <form th:action="@{/login}" method="post">
    <label for="username">Email</label>
    <input id="username" name="username" type="email" autocomplete="username" required autofocus>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
  </form>

  <p class="footer">¿No tienes cuenta? <a th:href="@{/register}">Crear cuenta</a></p>
</main>
</body>
</html>
