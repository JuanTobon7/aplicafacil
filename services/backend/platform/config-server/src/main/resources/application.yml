server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native": lee los YAML desde el sistema de archivos (services/backend/config-repo).
    # Para producción se puede cambiar a "git" apuntando a un repo de configuración.
    active: native
  cloud:
    config:
      server:
        native:
          # Docker: CONFIG_REPO_LOCATION=file:/config-repo/
          # Local: se busca desde la raíz del backend o desde el directorio del módulo.
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo/,file:../../config-repo/,file:./services/backend/config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
