# Reemplaza al application.yml principal en los tests: sin config-server ni Eureka.
# Postgres y RabbitMQ los provee Testcontainers (@ServiceConnection).
spring:
  application:
    name: ai-config-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: aiconfig
  flyway:
    schemas: aiconfig
    default-schema: aiconfig
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

aplicafacil:
  ai:
    credential-readers: [mcp-gateway]
    request-timeout: 2m
    max-configs-per-user: 3
    provider-types:
      - type: OPENAI
        display-name: OpenAI
        allows-base-url: true
        default-model: gpt-4.1-mini
        suggested-models: [gpt-4.1-mini]
      - type: OPENROUTER
        display-name: OpenRouter
        allows-base-url: false
        default-model: openai/gpt-4.1-mini

eureka:
  client:
    enabled: false
