# Reemplaza al application.yml principal en los tests: sin config-server ni Eureka.
# La base de datos la provee Testcontainers (@ServiceConnection).
spring:
  application:
    name: computrabajo-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: computrabajo
  flyway:
    schemas: computrabajo
    default-schema: computrabajo

eureka:
  client:
    enabled: false
