# Infraestructura local de AplicaFacil (ADR 0003).
#
# Uso (desde infra/, con .env creado a partir de .env.example):
#   docker compose up -d                   → Postgres + RabbitMQ + Redis
#   docker compose --profile tools up -d   → además pgAdmin (http://127.0.0.1:5050)
#   docker compose --profile apps up -d    → además los servicios Java en contenedores (solo para la
#                                            fase desplegada: linkedin-service NO va aquí porque abre un
#                                            navegador visible y corre en el host)
#
# Todos los puertos se publican SOLO en 127.0.0.1: nada queda expuesto en la red local.
#   postgres ${POSTGRES_PORT:-5434} · rabbitmq 5672 / 15672 (UI) · redis 6380 · pgadmin 5050

name: aplicafacil-platform

x-backend-env: &backend-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka/
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB}
  IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
  LINKEDIN_DB_PASSWORD: ${LINKEDIN_DB_PASSWORD}
  COMPUTRABAJO_DB_PASSWORD: ${COMPUTRABAJO_DB_PASSWORD:-computrabajo_svc}
  PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
  JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD}
  AICONFIG_DB_PASSWORD: ${AICONFIG_DB_PASSWORD:-aiconfig_svc}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # El token trae iss = URL pública de identity-service; las llaves se consultan por la red interna
  AUTH_ISSUER_URI: http://127.0.0.1:9000
  AUTH_JWKS_URI: http://identity-service:9000/.well-known/jwks.json
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}

x-backend-service: &backend-service
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
    config-server:
      condition: service_started
    discovery-server:
      condition: service_started

services:
  # ═══════════════════════ Infraestructura (siempre) ═══════════════════════
  postgres:
    # PostgreSQL 18 + pgvector (embeddings de profile-service)
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      LINKEDIN_DB_PASSWORD: ${LINKEDIN_DB_PASSWORD}
      COMPUTRABAJO_DB_PASSWORD: ${COMPUTRABAJO_DB_PASSWORD:-computrabajo_svc}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD}
      AICONFIG_DB_PASSWORD: ${AICONFIG_DB_PASSWORD:-aiconfig_svc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  # ═══════════════════════ Herramientas (--profile tools) ═══════════════════════
  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════ Fase desplegada (--profile apps) ═══════════════════════
  config-server:
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: platform/config-server
    restart: on-failure
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo/
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ../services/backend/config-repo:/config-repo:ro

  discovery-server:
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: platform/discovery-server
    restart: on-failure
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "127.0.0.1:8761:8761"

  api-gateway:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: platform/api-gateway
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8080:8080"

  identity-service:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: identity-service
    environment:
      <<: *backend-env
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      LINKEDIN_OAUTH_ENABLED: ${LINKEDIN_OAUTH_ENABLED:-false}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:9000:9000"

  profile-service:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: profile-service
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8084:8084"

  jobs-service:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: jobs-service
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8082:8082"

  automation-service:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: automation-service
    environment:
      <<: *backend-env
      MCP_GATEWAY_URL: http://mcp-gateway:8000
    ports:
      - "127.0.0.1:8083:8083"

  ai-config-service:
    <<: *backend-service
    profiles: [apps]
    build:
      context: ../services/backend
      args:
        MODULE: ai-config-service
    environment:
      <<: *backend-env
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      SESSION_ENCRYPTION_KEY_VERSION: ${SESSION_ENCRYPTION_KEY_VERSION:-1}
    ports:
      - "127.0.0.1:8086:8086"

  # Servidor MCP (Python/Django, ADR 0005). Se registra en Eureka con un hostname que los demás
  # contenedores resuelven (el nombre del servicio), no con el id del contenedor.
  mcp-gateway:
    profiles: [apps]
    build:
      context: ../services/mcp-gateway
    restart: on-failure
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_RESOURCE_URL: http://127.0.0.1:8000/mcp
      MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,mcp-gateway:*"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,mcp-gateway"
      AUTH_ISSUER_URI: http://127.0.0.1:9000
      AUTH_JWKS_URI: http://identity-service:9000/.well-known/jwks.json
      IDENTITY_SERVICE_URL: http://identity-service:9000
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      AI_CONFIG_SERVICE_URL: lb://ai-config-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: mcp-gateway
      MCP_CREDENTIAL_TTL_SECONDS: ${MCP_CREDENTIAL_TTL_SECONDS:-3600}
      MCP_RECONCILE_INTERVAL_SECONDS: ${MCP_RECONCILE_INTERVAL_SECONDS:-300}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:
